<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="title desc"><title id="title">Infographic Storytelling — du cours à l'histoire</title><desc id="desc">Quatre étapes : fournir le contenu, choisir le style, structurer le récit, générer et vérifier l'infographie.</desc><rect width="1200" height="780" rx="28" fill="#fffaf2"/><rect x="24" y="24" width="1152" height="732" rx="20" fill="#fff" stroke="#20262d" stroke-width="3"/><g font-family="Arial,Helvetica,sans-serif" fill="#20262d"><text x="600" y="79" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="5">THE LEARNING COMIC FACTORY</text><text x="600" y="132" font-size="49" font-weight="900" text-anchor="middle">Du cours à l'histoire</text><text x="600" y="166" font-size="21" text-anchor="middle">Une leçon. Quatre chapitres. Deux identités visuelles.</text><path d="M83 244V672" stroke="#20262d" stroke-width="3" stroke-dasharray="7 7"/><path d="M74 666L83 680L92 666" fill="none" stroke="#20262d" stroke-width="3"/><g transform="translate(50 196)"><circle cx="33" cy="48" r="31" fill="#2B5B84"/><text x="33" y="59" font-size="32" font-weight="bold" text-anchor="middle" fill="white">1</text><rect x="82" y="0" width="1002" height="111" rx="17" fill="#e9f0f7"/><text x="105" y="36" font-size="27" font-weight="bold">LE CONTENU</text><text x="105" y="70" font-size="20">Cours, vocabulaire, notes ou règles à retenir.</text><text x="105" y="95" font-size="17">Personnages · langues · termes obligatoires</text><g transform="translate(860 15)" stroke="#20262d" stroke-width="3" stroke-linejoin="round"><path d="M0 0H80L105 24V81H0Z" fill="#fff"/><path d="M80 0V24H105M15 25H62M15 43H87M15 60H75" fill="none"/><path d="M125 38H165M153 26L165 38L153 50" fill="none"/></g></g><g transform="translate(50 319)"><circle cx="33" cy="48" r="31" fill="#6B5A86"/><text x="33" y="59" font-size="32" font-weight="bold" text-anchor="middle" fill="white">2</text><rect x="82" width="1002" height="111" rx="17" fill="#f0eaf5"/><text x="105" y="34" font-size="27" font-weight="bold">LE STYLE</text><text x="105" y="68" font-size="20">COLOR : bande dessinée pédagogique</text><text x="105" y="94" font-size="20">MINIMAL : croquis noir et blanc</text><g transform="translate(850 12)" stroke="#20262d" stroke-width="2.5"><rect width="82" height="85" rx="6" fill="#fff"/><rect x="6" y="6" width="70" height="14" rx="3" fill="#2B5B84" stroke="none"/><circle cx="40" cy="39" r="12" fill="#f5ca9b"/><path d="M19 77Q19 52 40 52Q61 52 61 77Z" fill="#44715B"/><rect x="100" width="82" height="85" rx="6" fill="#fff"/><circle cx="110" cy="12" r="5" fill="#6B5A86" stroke="none"/><path d="M121 12H173" fill="none"/><circle cx="140" cy="39" r="12" fill="white"/><path d="M119 77Q119 52 140 52Q161 52 161 77Z" fill="white"/></g></g><g transform="translate(50 442)"><circle cx="33" cy="48" r="31" fill="#44715B"/><text x="33" y="59" font-size="32" font-weight="bold" text-anchor="middle" fill="white">3</text><rect x="82" width="1002" height="111" rx="17" fill="#eaf3eb"/><text x="105" y="34" font-size="27" font-weight="bold">LE RÉCIT</text><text x="105" y="68" font-size="20">Problème → tentative → découverte → résolution</text><text x="105" y="94" font-size="17">Le skill applique le prompt maître et contrôle la densité.</text><g transform="translate(839 32)" stroke="#20262d" stroke-width="2"><rect width="45" height="48" rx="5" fill="#fff"/><rect x="54" width="45" height="48" rx="5" fill="#fff"/><rect x="108" width="45" height="48" rx="5" fill="#fff"/><rect x="162" width="45" height="48" rx="5" fill="#fff"/><g fill="#20262d" stroke="none" font-size="22" font-weight="bold" text-anchor="middle"><text x="22" y="31">1</text><text x="76" y="31">2</text><text x="130" y="31">3</text><text x="184" y="31">4</text></g></g></g><g transform="translate(50 565)"><circle cx="33" cy="48" r="31" fill="#B8753F"/><text x="33" y="59" font-size="32" font-weight="bold" text-anchor="middle" fill="white">4</text><rect x="82" width="1002" height="111" rx="17" fill="#f8ecdd"/><text x="105" y="34" font-size="27" font-weight="bold">LE RÉSULTAT</text><text x="105" y="68" font-size="20">Générer avec l'outil d'image, puis vérifier le rendu.</text><text x="105" y="94" font-size="17">Sans générateur : transmettre le prompt et la référence.</text><g transform="translate(909 12)" stroke="#20262d" stroke-width="2.5"><rect width="72" height="88" rx="5" fill="white"/><path d="M12 17H60M12 25H49" fill="none"/><g fill="#fff"><rect x="12" y="34" width="20" height="16" rx="3"/><rect x="40" y="34" width="20" height="16" rx="3"/><rect x="12" y="58" width="20" height="16" rx="3"/><rect x="40" y="58" width="20" height="16" rx="3"/></g><circle cx="83" cy="74" r="18" fill="#44715B" stroke="white"/><path d="M74 74L81 81L94 66" fill="none" stroke="white" stroke-width="4"/></g></g><text x="600" y="724" text-anchor="middle" font-size="22" font-weight="bold">ChatGPT · Claude · Codex · VS Code</text></g></svg>